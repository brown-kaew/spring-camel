info:
  build:
    artifact: @project.artifactId@
    name: @project.name@
    description: @project.description@
    version: @project.version@

server:
  port: 8080
  servlet:
    contextPath: /api
  shutdown: graceful

spring:
  redis:
    host: localhost
    timeout: 15s
    port: 6379
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    virtual-host: /
    requested-heartbeat: 20
    channel-rpc-timeout: 30000
    publisher-confirm-type: simple

camel:
  component:
    spring-rabbitmq:
      auto-declare: false
      test-connection-on-startup: true
      message-listener-container-type: DMLC
      maximum-retry-attempts: 0
